<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Connecting...</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0b0f1e; color: #f2f4fb; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
</style>
</head>
<body>
<p id="msg">Completing connection...</p>
<script>
  (function () {
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const state = params.get('state');
    const error = params.get('error');

    if (window.opener) {
      window.opener.postMessage({ type: 'osai-oauth-callback', code, state, error }, window.location.origin);
    }
    document.getElementById('msg').textContent = error ? `Connection failed: ${error}` : 'Connected. You can close this window.';
    setTimeout(() => window.close(), error ? 3000 : 1200);
  })();
</script>
</body>
</html>
